services:
  c1:
    build: .
    expose:
      - 8080
    volumes:
      - ./dist:/dist
      - ./log/c1/:/log
    environment:
      - AGT_UUID=c1
      - AGT_PORT=8080
      - AGT_HOST=0.0.0.0
      - AGT_LOG_PATH=/log
      - AGT_CLIENT_CONTROL_URL=http://127.0.0.1:8080/control
      - AGT_WORKERS=2
      - AGT_USER_KEY_OBJUUID=shared-user-key
      - AGT_USER_KEY_PASSPHRASE=password
    command:
      - bash
      - -c
      - |
        set -e
        pip install -q /dist/*.whl
        agt-configure --load-env
        agt-configure --view
        agt-control discover http://c2:8080/mpi --delay 20 &
        agt-server

  c2:
    build: .
    expose:
      - 8080
    volumes:
      - ./dist:/dist
      - ./log/c2/:/log
    command:
      - bash
      - -c
      - |
        set -e
        pip install -q /dist/*.whl
        agt-configure --agtuuid c2 --port 8080 --host 0.0.0.0 --log-path /log --workers 2
        agt-configure --client-local
        agt-configure --user-key-objuuid shared-user-key --user-key-passphrase password
        agt-control discover http://c1:8080/mpi --delay 20 &
        agt-control discover http://c3:8080/mpi --delay 20 &
        agt-server
  c3:
    build: .
    expose:
      - 8080
    volumes:
      - ./dist:/dist
      - ./log/c3/:/log
    command:
      - bash
      - -c
      - |
        set -e
        pip install -q /dist/*.whl
        agt-configure --agtuuid c3 --port 8080 --host 0.0.0.0 --log-path /log --workers 2
        agt-configure --client-local
        agt-control set-user-key c3 shared-user-key password --delay 20 &
        agt-control discover http://c2:8080/mpi --delay 30 &
        agt-server
  c4:
    build: .
    expose:
      - 8080
    volumes:
      - ./dist:/dist
      - ./log/c4/:/log
    command:
      - bash
      - -c
      - |
        set -e
        pip install -q /dist/*.whl
        agt-configure --agtuuid c4 --port 8080 --host 0.0.0.0 --log-path /log --workers 2
        agt-configure --client-local
        agt-control set-user-key c4 shared-user-key password --delay 20 &
        agt-control discover http://c3:8080/mpi --polling --delay 30 &
        agt-control discover http://c5:8080/mpi --delay 30 &
        agt-server
  c5:
    build: .
    expose:
      - 8080
    volumes:
      - ./dist:/dist
      - ./log/c5/:/log
    command:
      - bash
      - -c
      - |
        set -e
        pip install -q /dist/*.whl
        agt-configure --agtuuid c5 --port 8080 --host 0.0.0.0 --log-path /log --workers 2
        agt-configure --client-local
        agt-control set-user-key c5 shared-user-key password --delay 20 &
        agt-control discover http://c4:8080/mpi --delay 30 &
        agt-server

